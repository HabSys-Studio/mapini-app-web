<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapini</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="brand-container">
            <h1>Mapini</h1>
            <button id="btn-mi-ubicacion" class="btn-ubicacion-bar">🎯 Mi ubicación</button>
        </div>
        <button id="btn-admin" class="btn-primary">Administración</button>
    </header>

    <main class="main-container">
        <!-- Panel Fijo de Información del Comercio -->
        <div id="panel-info-local" class="panel-info hidden"></div>

        <!-- Contenedor del Mapa Principal -->
        <div id="map"></div>

        <!-- Modal de Login / Administración -->
        <div id="modal-admin" class="modal hidden">
            <div class="modal-content">
                <span id="btn-cerrar-modal" class="close">&times;</span>
                <h2>Ingreso Administración</h2>
                
                <form id="form-login">
                    <input type="text" id="usuario" placeholder="Usuario" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    
                    <div class="link-container">
                        <button type="button" id="btn-olvide-pass" class="btn-link">Olvidé mi contraseña</button>
                    </div>

                    <button type="submit" class="btn-success">Ingresar</button>
                    
                    <div class="register-container">
                        <button type="button" id="btn-registrarme" class="btn-link-bold">REGISTRARME</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
